baseURL     = "https://13ryanC.github.io/"
languageCode = "en-gb"
title       = "Bryan Chan"
publishDir  = "public"
theme       = ["hugo-PaperMod", "hugo-cite"]
# theme       = "hugo-PaperMod"
enableRobotsTXT = true
copyright   = "© Bryan Chan"

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"
  legacy   = "legacy"

[cite]

  bib = "data/pubs.json"

# Primary navigation. Older sections (Series, Tags, Books, Legacy, archive)
# stay published and are linked from the Writing page and footer.
[menu]

  [[menu.main]]
    identifier = "research"
    name       = "Research"
    url        = "/research/"
    weight     = 10

  [[menu.main]]
    identifier = "writing"
    name       = "Writing"
    url        = "/posts/"
    weight     = 20

  [[menu.main]]
    identifier = "about"
    name       = "About"
    url        = "/about/"
    weight     = 30

  [[menu.main]]
    identifier = "search"
    name       = "Search"
    url        = "/search/"
    weight     = 40

# Number of posts per page
[pagination]
  pagerSize = 20

# ---- Hugo core ----
enableGitInfo = true          # ask Hugo to query Git history
# Pin the date‑field precedence so Git wins first:
[frontmatter]
  lastmod = [":git", "lastmod", "date"]

# JSON index powers the PaperMod search page
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Distilled Python Docs are kept in content/distilled-python-docs/ but not
# published: no pages are built and nothing links to them. Delete this block
# to publish them again.
[[cascade]]
  [cascade.build]
    list   = "never"
    render = "never"
  [cascade.target]
    path = "{/distilled-python-docs,/distilled-python-docs/**}"

############################
# 1. Site-wide PaperMod flags
############################
[params]
  env                 = "production"   # enables OpenGraph / Twitter / schema.org metadata
  mainSections        = ["posts", "books"]
  math                = true
  mermaid             = true
  ShowCodeCopyButtons = true     # clipboard icon on every ``` fence
  ShowPageNums       = true      # so the nav bar is visible
  description        = "Bryan Chan is an independent AI safety researcher working on preventing model misalignment, evaluating emerging risks, and developing reliable safeguards."
  keywords           = ["AI safety", "alignment", "model misalignment", "AI evaluations", "sycophancy", "steganography", "Bryan Chan"]
  author             = "Bryan Chan"
  defaultTheme       = "auto"
  ShowLastMod        = true
  ShowReadingTime    = true
  ShowShareButtons   = false
  ShowBreadCrumbs    = false     # the active menu item already shows where you are
  hideAuthor         = true      # single-author site; the name is in the header
  ShowPostNavLinks   = true
  disableSpecial1stPost = true
  showtoc            = true
  UseHugoToc         = false
  tocopen            = false

  # Homepage copy lives in layouts/index.html; research entries in data/research.yaml.
  [params.home]
    intro   = "Independent AI safety researcher working on preventing model misalignment, evaluating emerging risks, and developing reliable safeguards."
    recentWriting = 5

  [params.schema]
    publisherType = "Person"
    sameAs = [
      "https://www.linkedin.com/in/cnm13ryan/",
      "https://x.com/cnm13ryan",
      "https://github.com/cnm13ryan",
      "https://www.lesswrong.com/users/13ryanc"
    ]

  [params.social]
    twitter = "cnm13ryan"   # twitter:site card metadata

  [params.footer]
    # Profile links appear once, here, on every page
    text = "[LinkedIn](https://www.linkedin.com/in/cnm13ryan/) · [X](https://x.com/cnm13ryan) · [GitHub](https://github.com/cnm13ryan) · [LessWrong](https://www.lesswrong.com/users/13ryanc) · [RSS](/index.xml)"

[params.assets]
  favicon        = "favicon.svg"
  favicon16x16   = "favicon.svg"
  favicon32x32   = "favicon.svg"
  apple_touch_icon  = "favicon.svg"
  safari_pinned_tab = "favicon.svg"
  theme_color    = "#fbfaf6"
  msapplication_TileColor = "#fbfaf6"
  customCSS = [
    "css/math-table.css",    # (if you added this earlier)
    "css/math-scroll.css",    #  ← NEW
    "css/pagination.css",     # styles for custom pagination
    "css/books.css"           # styles for books page
  ]
  customJS = [
    "js/vendor/mermaid.min.js",
    "js/vendor/svg-pan-zoom.min.js",
    "js/mermaid-bootstrap.js"
  ]

########################################
# 2. Goldmark & syntax-highlight tweaks
########################################
[markup]

  [markup.goldmark.renderer]
    unsafe = true         # ←  allow raw HTML

  [markup.goldmark.parser]
    # convert the old boolean to an inline-table
    # (block = fenced-block attributes like ```mermaid {…} )
    # (title = allow title="…"  as alias)
    attribute = { block = true, title = true }

  [markup.highlight]
    style = "github"
    codeFences = true            # colourise ``` fences
    noClasses  = false           # keep CSS classes so PaperMod’s palette applies
    guessSyntax = true          # speed boost; flip to true if you omit languages
    lineNos    = false
    lineNumbersInTable = true
    defaultMarkdownHandler = 'goldmark'

  [markup.goldmark.extensions]
    footnote = true            # optional, useful for citations/notes

    [markup.goldmark.extensions.passthrough]
      enable = true

      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]
