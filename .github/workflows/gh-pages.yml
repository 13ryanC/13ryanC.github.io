# .github/workflows/gh-pages.yml
name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [ main ]        # trigger only from the default branch
  workflow_dispatch:          # allow manual re-runs

# Least privilege: nothing by default, each job asks for what it needs.
permissions: {}

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout

    steps:
    # 1 – get the code *and* the PaperMod submodule
    # Actions are pinned to full commit SHAs (tag in the comment) so a moved
    # tag cannot change what runs; Dependabot keeps them updated.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive
        persist-credentials: false

    # 2 – install Hugo (extended) fast
    - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
      with:
        hugo-version: '0.155.3'              # 'lastest' or '0.146.0'
        extended: true

    # 3 – build the site
    - name: Build
      run: hugo --minify

    # 3b – fail the deploy if a security regression slipped in
    - name: Security checks
      run: scripts/security-check.sh public

    # 4 – package the ./public folder for Pages
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write            # upload & deploy
      id-token: write         # OIDC for deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    # 5 – deploy the artifact produced above
    - id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
